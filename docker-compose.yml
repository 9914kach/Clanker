services:
  # Discord-hub (Vite/React). Start: docker compose --profile discord up -d discord-hub-web
  discord-hub-web:
    profiles: ["discord"]
    build:
      context: .
      dockerfile: apps/discord-hub-web/Dockerfile
    container_name: discord-hub-web
    ports:
      - "${DISCORD_HUB_WEB_PORT:-4173}:80"
    restart: unless-stopped

  # Lokala dev-verktyg (dokumentation m.m.). Start: docker compose --profile devtools up -d dev-tools-web
  dev-tools-web:
    profiles: ["devtools"]
    build:
      context: .
      dockerfile: apps/dev-tools-web/Dockerfile
    container_name: dev-tools-web
    ports:
      - "${DEV_TOOLS_WEB_PORT:-4174}:80"
    restart: unless-stopped

  # Reverse proxy (HTTP) — värdnamn → webbcontainrarna. Start: --profile caddy (tillsammans med discord + devtools).
  clanker-caddy:
    profiles: ["caddy"]
    image: caddy:2-alpine
    container_name: clanker-caddy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      CLANKER_DISCORD_HOST: ${CLANKER_DISCORD_HOST:-clanker.local}
      CLANKER_DEVTOOLS_HOST: ${CLANKER_DEVTOOLS_HOST:-devtools.local}
    restart: unless-stopped

  # PostgreSQL — aktivera när du har backend. Start: docker compose --profile db up -d clanker-db
  clanker-db:
    profiles: ["db"]
    image: postgres:16-alpine
    container_name: clanker-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clanker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clanker_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-clanker}
    volumes:
      - clanker-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped

  clanker-pihole:
    env_file:
      - .env
    image: pihole/pihole:latest
    container_name: clanker-pihole
    hostname: clanker-pihole
    network_mode: "host"
    restart: unless-stopped
    volumes:
      - "./etc-pihole:/etc/pihole"
      - "./etc-dnsmasq.d:/etc/dnsmasq.d"
    cap_add:
      - NET_ADMIN

volumes:
  clanker-pgdata:
